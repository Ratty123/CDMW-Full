[package]
name = "cd_texture"
version = "0.1.0"
edition = "2021"
description = "Native Crimson Desert texture preview preprocessing core"
license = "MIT"

[lib]
name = "cd_texture"
path = "src/lib.rs"

[[bin]]
name = "cd-texture"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
