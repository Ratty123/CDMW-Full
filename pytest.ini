[pytest]
addopts = -m "not visual and not real_game and not timing"
testpaths = tests
markers =
    visual: opens a window or drives native mouse input; opt in explicitly
    real_game: reads locally installed game assets; opt in explicitly
    timing: asserts wall-clock responsiveness; needs a machine whose
        scheduler you control, so opt in explicitly. A shared runner can
        deschedule the process for seconds at a time, which fails these for
        the machine being busy rather than for the code blocking the UI.
        `scripts/codex_check.ps1 -Area responsiveness` runs them.
norecursedirs =
    .git
    .pytest_cache
    .pytest-tmp
    .pytest-tmp*
    .venv
    __pycache__
    app_restore_points
    archive_cache
    build
    crash_reports
    dist
    texture_editor_workspace
