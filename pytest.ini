[pytest]
addopts = -m "not visual and not real_game"
testpaths = tests
markers =
    visual: opens a window or drives native mouse input; opt in explicitly
    real_game: reads locally installed game assets; opt in explicitly
norecursedirs =
    .git
    .pytest_cache
    .pytest-tmp
    .pytest-tmp*
    .venv
    __pycache__
    app_restore_points
    archive_cache
    build
    crash_reports
    dist
    texture_editor_workspace
