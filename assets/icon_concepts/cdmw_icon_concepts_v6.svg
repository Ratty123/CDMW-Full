      .orange2 { fill: #f07a20; }
      .blue { fill: #2f6fed; }
      .teal { fill: #16a0a8; }
      .green { fill: #2aa85a; }
      .stroke { fill: none; stroke: #ffffff; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #ff9f1c; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; }
