<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <linearGradient id="ink-split" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1422"/>
      <stop offset=".58" stop-color="#121827"/>
      <stop offset="1" stop-color="#243349"/>
    </linearGradient>
    <linearGradient id="deep-fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26364d"/>
      <stop offset="1" stop-color="#101521"/>
    </linearGradient>
    <linearGradient id="warm-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f1c"/>
      <stop offset="1" stop-color="#f26d1b"/>
    </linearGradient>
    <linearGradient id="cool-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#365176"/>
      <stop offset="1" stop-color="#162132"/>
    </linearGradient>
    <pattern id="grain" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M2 3h2M9 8h3M5 12h1" fill="none" stroke="#ffffff" stroke-width="1" opacity=".12"/>
    </pattern>
    <pattern id="ridges" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M-5 18 18-5M3 21 21 3" fill="none" stroke="#ffffff" stroke-width="1.2" opacity=".11"/>
    </pattern>
    <style>
      .page { fill: #f3f0e8; }
      .ink { fill: #101521; }
      .ink2 { fill: #182235; }
      .ink3 { fill: #26364d; }
      .white { fill: #ffffff; }
      .bone { fill: #f5efe3; }
      .orange { fill: #ff9517; }
      .orange2 { fill: #f4741e; }
      .teal { fill: #1aa3a6; }
      .blue { fill: #3268d9; }
      .mulberry { fill: #4b2d4f; }
      .sage { fill: #6f8f70; }
      .shadow { fill: #000000; opacity: .18; }
      .soft { opacity: .2; }
    </style>
  </defs>

  <rect class="page" width="1400" height="720"/>

  <!-- 1: faceted hex with curved top cut -->
  <g transform="translate(70 50)">
    <path d="M100 4 182 49v104l-82 47-82-47V49z" fill="url(#ink-split)"/>
    <path d="M100 4 182 49v104l-82-47z" fill="#253750"/>
    <path d="M18 49Q60 27 100 4v102L18 153z" fill="#101521"/>
    <path class="white" d="M50 99 105 40h43L95 99l49 55h-43z"/>
    <path d="M86 128h66l25 31h-72z" fill="url(#warm-edge)"/>
  </g>

  <!-- 2: bent slab with brushed face -->
  <g transform="translate(330 50)">
    <path class="ink" d="M28 57 84 12h122v148l-45 45H28z"/>
    <path d="M84 12h122l-45 45H28z" fill="url(#cool-edge)"/>
    <path class="ink2" d="M161 57h45v103l-45 45z"/>
    <path d="M28 57h161v103H28z" fill="url(#ridges)" opacity=".55"/>
    <path class="white" d="M57 105 110 52h39l-49 55 48 54h-40z"/>
    <path class="orange2" d="M72 134h92v31H72z"/>
  </g>

  <!-- 3: rounded shield with carved seam -->
  <g transform="translate(590 50)">
    <path d="M100 3c42 20 74 30 90 30v71c0 66-90 99-90 99S10 170 10 104V33c16 0 48-10 90-30z" fill="url(#ink-split)"/>
    <path class="ink3" d="M100 3c42 20 74 30 90 30v71c0 66-90 99-90 99z"/>
    <path class="soft" d="M38 54c35-15 84-18 127-7" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <path class="white" d="M51 100 106 39h43L96 100l50 56h-43z"/>
    <path d="M72 132h92l14 29H72z" fill="url(#warm-edge)"/>
  </g>

  <!-- 4: soft squircle stone with grain -->
  <g transform="translate(850 50)">
    <path d="M27 63c0-34 28-61 62-61h22c34 0 62 27 62 61v74c0 34-28 61-62 61H89c-34 0-62-27-62-61z" fill="url(#ink-split)"/>
    <path d="M100 2h11c34 0 62 27 62 61v74c0 34-28 61-62 61H100z" fill="#22314a"/>
    <path d="M27 63c0-34 28-61 62-61h22c34 0 62 27 62 61v74c0 34-28 61-62 61H89c-34 0-62-27-62-61z" fill="url(#grain)"/>
    <path class="white" d="M53 99 106 42h42L97 99l49 55h-42z"/>
    <path class="orange" d="M68 130h98v30H68z"/>
  </g>

  <!-- 5: curved crescent body -->
  <g transform="translate(1110 50)">
    <path class="ink" d="M181 101c0 56-45 101-101 101-31 0-58-14-77-35 38 8 78-4 105-32 28-29 40-70 29-109 26 18 44 48 44 75z"/>
    <path d="M95 0c45 0 82 28 98 67-30-15-66-11-92 12-31 27-43 71-29 110-42-11-72-49-72-94C0 42 42 0 95 0z" fill="url(#ink-split)"/>
    <path class="teal" d="M138 28c17 12 30 29 37 49l-60 35z"/>
    <path class="white" d="M48 98 104 39h42L94 98l48 54h-42z"/>
    <path d="M79 130h88l20 29h-96z" fill="url(#warm-edge)"/>
  </g>

  <!-- 6: contour hex, less rigid -->
  <g transform="translate(70 395)">
    <path d="M99 2 184 44c8 53-8 108-49 154-55 8-104-8-145-48-9-54 6-106 50-151z" fill="url(#ink-split)"/>
    <path class="ink3" d="M99 2 184 44c8 53-8 108-49 154L99 100z"/>
    <path d="M46 60c30-23 75-31 112-14M39 91c36-27 93-31 134-8M44 124c31-15 71-17 105-4" fill="none" stroke="#ffffff" stroke-width="4" opacity=".16" stroke-linecap="round"/>
    <path class="white" d="M51 101 106 40h42L96 101l49 54h-42z"/>
    <path class="orange" d="M75 133h94v30H75z"/>
  </g>

  <!-- 7: layered leaf fold -->
  <g transform="translate(330 395)">
    <path d="M23 117C23 45 82 5 178 5c2 92-40 154-114 184-27-15-41-42-41-72z" fill="url(#ink-split)"/>
    <path class="sage" d="M178 5c2 92-40 154-114 184l58-103z" opacity=".75"/>
    <path class="white" d="M57 102 108 45h41l-49 57 48 54h-41z"/>
    <path d="M84 133h75l28 29h-96z" fill="url(#warm-edge)"/>
  </g>

  <!-- 8: beveled lozenge with diagonal texture -->
  <g transform="translate(590 395)">
    <path class="ink" d="M100 4 190 100l-90 96L10 100z"/>
    <path class="ink3" d="M100 4 190 100l-90 96z"/>
    <path d="M100 4 190 100l-90 96L10 100z" fill="url(#ridges)" opacity=".48"/>
    <path class="white" d="M52 100 106 40h42L96 100l49 55h-42z"/>
    <path class="orange2" d="M73 131h94v30H73z"/>
  </g>

  <!-- 9: asymmetric pebble, warm notch -->
  <g transform="translate(850 395)">
    <path d="M99 4c54-4 96 30 98 82 2 58-44 104-104 100-53-4-91-41-91-91C2 44 45 8 99 4z" fill="url(#ink-split)"/>
    <path class="mulberry" d="M99 4c54-4 96 30 98 82 2 58-44 104-104 100l23-94z" opacity=".55"/>
    <path class="white" d="M52 100 106 42h42L97 100l49 55h-42z"/>
    <path d="M82 131h77l25 30H94z" fill="url(#warm-edge)"/>
  </g>

  <!-- 10: split cube with curved shadow -->
  <g transform="translate(1110 395)">
    <path class="ink" d="M25 51 100 8l75 43v98l-75 43-75-43z"/>
    <path class="ink3" d="M100 8 175 51v98l-75-43z"/>
    <path class="blue" d="M25 51 100 8v98l-75 43z" opacity=".32"/>
    <path d="M49 132c37 22 80 23 125 2" fill="none" stroke="#ffffff" stroke-width="7" opacity=".16" stroke-linecap="round"/>
    <path class="white" d="M51 101 106 41h42L97 101l50 55h-43z"/>
    <path class="orange" d="M70 132h96v30H70z"/>
  </g>
</svg>
