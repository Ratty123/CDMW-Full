    <path d="M100 5 184 52v96l-84 48-84-48V52z" fill="url(#body-a)"/>
    <path class="right" d="M100 5 184 52v96l-84-48z"/>
    <path class="bottom" d="M16 148 100 100l84 48-84 48z"/>
    <path class="shadow" d="M94 100h48l39 48-55 14z"/>
    <path d="M50 99 106 38h43L96 99l49 55h-43z" fill="#dcecff"/>
    <path d="M88 129h70l22 29h-77z" fill="#477fce"/>
  </g>

  <!-- 8: violet accent, still cold -->
  <g transform="translate(590 395)">
    <path d="M100 5 184 52v96l-84 48-84-48V52z" fill="url(#body-b)"/>
    <path class="right" d="M100 5 184 52v96l-84-48z"/>
    <path class="bottom" d="M16 148 100 100l84 48-84 48z"/>
    <path class="shadow" d="M94 100h48l39 48-55 14z"/>
