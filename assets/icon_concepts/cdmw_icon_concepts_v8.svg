    <path d="M100 5 184 52v96l-84 48-84-48V52z" fill="url(#body-c)"/>
    <path class="right" d="M100 5 184 52v96l-84-48z"/>
    <path class="bottom" d="M16 148 100 100l84 48-84 48z"/>
    <path class="shadow" d="M96 100h47l37 48-54 15z"/>
    <path d="M50 99 106 38h43L96 99l49 55h-43z" fill="url(#cyan)"/>
