<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <linearGradient id="body-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d18"/>
      <stop offset=".62" stop-color="#111b2c"/>
      <stop offset="1" stop-color="#304766"/>
    </linearGradient>
    <linearGradient id="body-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b14"/>
      <stop offset=".55" stop-color="#0d1626"/>
      <stop offset="1" stop-color="#263b5a"/>
    </linearGradient>
    <linearGradient id="body-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a101d"/>
      <stop offset=".5" stop-color="#182844"/>
      <stop offset="1" stop-color="#365a7c"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf4fb"/>
      <stop offset="1" stop-color="#aabed4"/>
