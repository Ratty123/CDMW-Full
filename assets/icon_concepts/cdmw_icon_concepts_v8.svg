    <style>
      .page { fill: #f3f0e8; }
      .left { fill: #070d18; }
      .right { fill: #263b5a; }
      .bottom { fill: #111d31; }
      .cut { fill: #050912; opacity: .5; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .shadow { fill: #000000; opacity: .23; }
    </style>
  </defs>

  <rect class="page" width="1400" height="720"/>

  <!-- 1: cold steel, no orange -->
  <g transform="translate(70 50)">
    <path d="M100 5 184 52v96l-84 48-84-48V52z" fill="url(#body-a)"/>
