      <stop offset="1" stop-color="#9d8449"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e1d8ff"/>
      <stop offset="1" stop-color="#8a78d6"/>
