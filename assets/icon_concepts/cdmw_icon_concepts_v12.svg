      .side { fill: #203653; }
      .shadow { fill: #000000; opacity: .26; }
      .purple { fill: url(#violet); }
      .blue { fill: url(#slab-blue); }
      .cyan { fill: url(#cyan); }
      .steel { fill: url(#steel); }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
