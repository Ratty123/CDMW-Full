    <linearGradient id="slab-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b779b"/>
      <stop offset="1" stop-color="#263b5a"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#777ec4"/>
      <stop offset="1" stop-color="#4f548e"/>
