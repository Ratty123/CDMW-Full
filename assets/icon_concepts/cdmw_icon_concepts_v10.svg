      <stop offset="1" stop-color="#314866"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101b"/>
      <stop offset="1" stop-color="#020711"/>
