      .left { fill: url(#leftFace); }
      .right { fill: url(#rightFace); }
      .top { fill: url(#topFace); }
      .dark { fill: #020711; }
      .mid { fill: #223753; }
      .edge { fill: #7fa0c5; }
      .amber { fill: url(#amber); }
      .cool { fill: url(#cool); }
      .shadow { fill: #000000; opacity: .28; }
      .soft { opacity: .28; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
