name: Windows Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  # Pushes to main run one interpreter leg, so this is what keeps the other one
  # honest. Work lands on main directly here rather than through pull requests,
  # and without a scheduled run the older interpreter would never be exercised.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      build_mode:
        description: Which package(s) to build
        required: true
        type: choice
        default: both
        options:
          - both
          - onefile
          - onedir
      sign_with_signpath:
        description: Submit the onefile artifact to SignPath
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Pushing a run of commits used to start a full pipeline per commit and finish
# every one of them. Only the newest is worth the runner. A tag is exempt
# because its pipeline produces the release artifact, and nothing should cancel
# that halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PIP_VERSION: "25.3"

jobs:
  # The suite is not a pure-Python suite. Several hundred tests drive the native
  # helpers for real -- mesh edit, DDS encode, UV unwrap -- and those paths fail
  # closed by design rather than falling back to Python, so without the binaries
  # they do not degrade, they fail. Build them once here and hand the same three
  # exes to both interpreter legs.
  native:
    name: Build native helpers
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # The helpers only change when native/ or the build script does, which is
      # rare, while the build itself is minutes of every push. The key covers
      # every input the build reads and the runner image that carries the
      # compiler, because a stale binary restored here would be handed to the
      # whole suite and quietly change what it proves.
      - name: Restore built native helpers
        id: native_helpers_cache
        uses: actions/cache@v4
        with:
          path: |
            native/*/build/Release
            native/cd_hkx/target/release/cd-hkx.exe
          key: native-helpers-${{ runner.os }}-${{ env.ImageVersion }}-${{ hashFiles('native/**', 'build_native_windows.ps1') }}

      # The script builds the four C++ helpers, then requires `dotnet` for the
      # Mesh Editor renderer and throws without it, and finally builds cd-hkx if
      # cargo is on PATH. Runners ship Rust, so that one comes along for free.
      - name: Set up .NET 10
        if: steps.native_helpers_cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build native helpers
        if: steps.native_helpers_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\build_native_windows.ps1 -Configuration Release

      # A restored cache has to satisfy the same requirement a fresh build does.
      # Failing here names the cache as the cause; letting it through would fail
      # later in QA as a missing helper, which reads like a product fault.
      - name: Confirm the restored helpers are complete
        if: steps.native_helpers_cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $expected = @(
            "native/cd_texture_dx/build/Release/cd-texture-dx.exe",
            "native/cdmw_mesh_core/build/Release/cdmw-mesh-core.exe",
            "native/cdmw_preview_core/build/Release/cdmw-preview-core.exe"
          )
          $missing = @($expected | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count -gt 0) {
            throw "Restored native helper cache is incomplete: $($missing -join ', ')"
          }
          $expected | ForEach-Object { "ok $_" }

      - name: Upload native helpers
        uses: actions/upload-artifact@v6
        with:
          name: native-helpers
          path: |
            native/*/build/Release/**
            native/cd_hkx/target/release/cd-hkx.exe
          if-no-files-found: error
          retention-days: 1

  qa:
    name: Headless QA / Python ${{ matrix.python-version }} / shard ${{ matrix.shard }}
    needs: native
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # A push to main runs the interpreter the package is built with, and
        # everything else runs both: pull requests, tags, the nightly schedule,
        # and a manual dispatch. The second leg is a compatibility check rather
        # than a different suite, so it does not have to gate every commit.
        python-version: >-
          ${{ (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
              && fromJSON('["3.14"]')
              || fromJSON('["3.11", "3.14"]') }}
        # The suite is one long sequential run, and a shared runner is slower per
        # core rather than short of cores: 22 minutes here against roughly 9 on a
        # developer machine. Each shard is an ordinary sequential run over half
        # the files, so nothing about how a test executes changes and nothing is
        # excluded to buy the time. It costs runner minutes instead.
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Restores native/<helper>/build/Release/, which is where
      # cdmw/core/texture_native.py and cdmw/modding/mesh_native_core.py look.
      - name: Download native helpers
        uses: actions/download-artifact@v7
        with:
          name: native-helpers
          path: native

      - name: Confirm the helpers the suite needs are present
        shell: pwsh
        run: |
          $expected = @(
            "native/cd_texture_dx/build/Release/cd-texture-dx.exe",
            "native/cdmw_mesh_core/build/Release/cdmw-mesh-core.exe",
            "native/cdmw_preview_core/build/Release/cdmw-preview-core.exe"
          )
          $missing = @($expected | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count -gt 0) {
            Get-ChildItem native -Recurse -Filter *.exe | ForEach-Object { $_.FullName }
            throw "Native helpers did not survive the artifact round trip: $($missing -join ', ')"
          }
          $expected | ForEach-Object { "ok $_" }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            constraints-release.txt

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Create virtual environment
        shell: pwsh
        run: python -m venv .venv

      - name: Install exact tested dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\python -m pip install "pip==$env:PIP_VERSION"
          .\.venv\Scripts\python -m pip install -c constraints-release.txt -r requirements-build.txt
          .\.venv\Scripts\python -m pip install "pytest==9.0.3"
          .\.venv\Scripts\python scripts\verify_release_dependencies.py
          .\.venv\Scripts\python -m pip check

      - name: Compile Python sources
        shell: pwsh
        run: .\.venv\Scripts\python -m compileall -q cdmw tests tools

      - name: Build the exact Mesh Editor helper exercised by QA
        shell: pwsh
        run: dotnet build tools\dotnet_mesh_editor_experiment\Cdmw.MeshEditorExperiment.csproj -c Release --nologo --verbosity:minimal

      - name: Run canonical nonvisual QA
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_ADDOPTS: '-m "not visual and not real_game"'
        run: |
          $baseTemp = Join-Path $env:RUNNER_TEMP "cdmw-pytest-${{ matrix.python-version }}-${{ matrix.shard }}"
          .\scripts\codex_check.ps1 -Area full -PytestBaseTemp $baseTemp -Shard ${{ matrix.shard }} -ShardCount 2

  package:
    name: Package after QA
    needs: qa
    # Building both PyInstaller modes is release work, not per-commit work, and
    # it was the longest job in the pipeline while running on every push and
    # every pull request. Tags and manual dispatch are when a package is
    # actually wanted.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      SELECTED_BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode || 'both' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            constraints-release.txt

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Create exact release environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install "pip==$env:PIP_VERSION"
          .\.venv\Scripts\python -m pip install -c constraints-release.txt -r requirements-build.txt
          .\.venv\Scripts\python scripts\verify_release_dependencies.py
          .\.venv\Scripts\python -m pip check

      - name: Build and startup-smoke onedir package
        if: env.SELECTED_BUILD_MODE == 'both' || env.SELECTED_BUILD_MODE == 'onedir'
        shell: pwsh
        run: .\build_pyside6_app.ps1 -Mode onedir -BuildProfile release

      - name: Build and startup-smoke onefile package
        if: env.SELECTED_BUILD_MODE == 'both' || env.SELECTED_BUILD_MODE == 'onefile'
        shell: pwsh
        run: |
          if ($env:SELECTED_BUILD_MODE -eq "both") {
            .\build_pyside6_app.ps1 -Mode onefile -BuildProfile release -SkipNativeBuild
          } else {
            .\build_pyside6_app.ps1 -Mode onefile -BuildProfile release
          }

      - name: Upload unsigned onedir artifact
        if: env.SELECTED_BUILD_MODE == 'both' || env.SELECTED_BUILD_MODE == 'onedir'
        uses: actions/upload-artifact@v6
        with:
          name: CrimsonDesertModWorkbench-onedir-unsigned
          path: dist/CrimsonDesertModWorkbench-*-windows
          if-no-files-found: error

      - name: Upload unsigned onefile artifact
        if: env.SELECTED_BUILD_MODE == 'both' || env.SELECTED_BUILD_MODE == 'onefile'
        id: upload_unsigned_onefile
        uses: actions/upload-artifact@v6
        with:
          name: CrimsonDesertModWorkbench-onefile-unsigned
          path: dist/CrimsonDesertModWorkbench-*-windows-portable.exe
          if-no-files-found: error

      - name: Validate SignPath settings
        if: (env.SELECTED_BUILD_MODE == 'both' || env.SELECTED_BUILD_MODE == 'onefile') && github.event_name == 'workflow_dispatch' && inputs.sign_with_signpath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $missing = @()
          if (-not $env:SIGNPATH_API_TOKEN) { $missing += "SIGNPATH_API_TOKEN secret" }
          if (-not $env:SIGNPATH_ORGANIZATION_ID) { $missing += "SIGNPATH_ORGANIZATION_ID variable" }
          if (-not $env:SIGNPATH_PROJECT_SLUG) { $missing += "SIGNPATH_PROJECT_SLUG variable" }
          if (-not $env:SIGNPATH_SIGNING_POLICY_SLUG) { $missing += "SIGNPATH_SIGNING_POLICY_SLUG variable" }
          if ($missing.Count -gt 0) {
            throw "Missing SignPath configuration: $($missing -join ', ')"
          }

      - name: Submit onefile artifact to SignPath
        if: (env.SELECTED_BUILD_MODE == 'both' || env.SELECTED_BUILD_MODE == 'onefile') && github.event_name == 'workflow_dispatch' && inputs.sign_with_signpath && vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG == ''
        id: signpath_default
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned_onefile.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-artifacts/onefile

      - name: Submit onefile artifact to SignPath (custom artifact config)
        if: (env.SELECTED_BUILD_MODE == 'both' || env.SELECTED_BUILD_MODE == 'onefile') && github.event_name == 'workflow_dispatch' && inputs.sign_with_signpath && vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG != ''
        id: signpath_custom
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned_onefile.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-artifacts/onefile

      - name: Upload signed onefile artifact
        if: steps.signpath_default.outcome == 'success' || steps.signpath_custom.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: CrimsonDesertModWorkbench-onefile-signed
          path: signed-artifacts/onefile/**
          if-no-files-found: error
