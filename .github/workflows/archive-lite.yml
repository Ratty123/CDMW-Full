name: Archive Lite (Python-free)

on:
  push:
    branches:
      - main
    paths:
      - "apps/Cdmw.ArchiveLite/**"
      - "native/cdmw_archive_core/**"
      - ".github/workflows/archive-lite.yml"
  pull_request:
    paths:
      - "apps/Cdmw.ArchiveLite/**"
      - "native/cdmw_archive_core/**"
      - ".github/workflows/archive-lite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: .NET 10 / native x64 / portable ZIP
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify, test, and package Archive Lite
        shell: pwsh
        run: .\apps\Cdmw.ArchiveLite\scripts\build_archive_lite.ps1

      - name: Upload portable Python-free ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CDMW-Archive-Lite-win-x64
          path: apps/Cdmw.ArchiveLite/artifacts/CDMW-Archive-Lite-*-win-x64.zip
          if-no-files-found: error
