name: CodeQL

# Security analysis is a weekly or manually requested check for this modding tool.
# GitHub's default setup must remain disabled while this workflow owns CodeQL.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A weekly run on the same commit as the last successful analysis repeats
  # five analyses of unchanged code. Manual dispatch always analyzes.
  changed:
    name: Check for new commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      analyze: ${{ steps.compare.outputs.analyze }}
    steps:
      - name: Compare with the last successful analysis
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "analyze=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$REPOSITORY/actions/workflows/codeql.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || echo "")
          if [ -n "$last" ] && [ "$last" = "$HEAD_SHA" ]; then
            echo "No commits since the last successful analysis of $HEAD_SHA; skipping."
            echo "analyze=false" >> "$GITHUB_OUTPUT"
          else
            echo "analyze=true" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changed
    if: needs.changed.outputs.analyze == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, csharp, python, rust]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze code
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: always
          # Optional database bundling stalled after successful SARIF upload.
          # Keep security results, without publishing database archives.
          upload-database: false
